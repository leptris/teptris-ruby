name: release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: 'Version to release (x.y.z or x.y.z.n lockstep {libteptris-semver}.{binding-patch}; or major/minor/patch). Empty = tag current VERSION.'
        type: string
        required: false

# contents: write pushes the version-bump commit + tag.
# id-token: write is required for RubyGems.org Trusted Publishing (OIDC).
permissions:
  contents: write
  id-token: write

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch' && inputs.next_version != ''
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'

      - name: Bump version.rb
        id: bump
        shell: bash
        env:
          NEXT_VERSION: ${{ inputs.next_version }}
        run: |
          set -euo pipefail
          INPUT="${NEXT_VERSION}"
          if [[ "$INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            :
          elif [[ "$INPUT" == "major" || "$INPUT" == "minor" || "$INPUT" == "patch" ]]; then
            CURRENT=$(ruby -Ilib -rteptris/version -e 'puts Teptris::VERSION')
            IFS=. read -r MA MI PA QU <<< "$CURRENT"
            QU="${QU:-0}"
            case "$INPUT" in
              major) MA=$((MA + 1)); MI=0; PA=0; QU=0 ;;
              minor) MI=$((MI + 1)); PA=0; QU=0 ;;
              patch) QU=$((QU + 1)) ;;
            esac
            INPUT="${MA}.${MI}.${PA}.${QU}"
          else
            echo "::error::next_version must be x.y.z[.n] or major/minor/patch, got '${INPUT}'"
            exit 1
          fi
          echo "Releasing ${INPUT}"
          sed -i "s/VERSION = \".*\"/VERSION = \"${INPUT}\"/" lib/teptris/version.rb
          NEW_VERSION=$(ruby -Ilib -rteptris/version -e 'puts Teptris::VERSION')
          echo "new-version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/teptris/version.rb
          if git diff --cached --quiet; then
            echo "No version change; tagging current HEAD."
          else
            git commit -m "Bump teptris to ${NEW_VERSION}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push bump commit + tag
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new-version }}
        run: |
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          git tag "v${NEW_VERSION}" HEAD
          git push origin "v${NEW_VERSION}"

  # The ruby-platform source gem: the SAME mandatory native ext,
  # compiled at install by the user's own toolchain (#7's no-fallback
  # decision concerned the BINDING — never a slow pure-Ruby parser;
  # this still fails loudly without a C compiler). Covers every
  # platform the 8 prebuilt gems do not: FreeBSD/OpenBSD/Solaris,
  # armv7/riscv64/ppc64le, any-glibc Linux, Windows Ruby 3.0.
  build-source:
    name: Build source gem
    needs: bump
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || github.ref }}
      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'
      - run: rake gem:source
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-ruby-source
          path: pkg/*.gem

  build:
    needs: bump
    if: always() && !cancelled() && !failure()
    runs-on: ${{ matrix.os }}
    # precompiled cells: the ext ships built (PGO); no runtime fallback
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: ucrt rubies bind x64-ucrt-rubyNNN.dll per minor, so
          # each cell builds ONE minor's extension; assemble-windows packs
          # them into a fat gem (nokogiri layout). RubyInstaller ARM64
          # builds exist only for 3.4 and 4.0; 3.0 is the last mingw32
          # (msvcrt) line.
          - { os: windows-latest,  platform: x64-mingw32,        ruby-version: '3.0' }
          - { os: windows-latest,  platform: x64-mingw-ucrt,     ruby-version: '3.1' }
          - { os: windows-latest,  platform: x64-mingw-ucrt,     ruby-version: '3.2' }
          - { os: windows-latest,  platform: x64-mingw-ucrt,     ruby-version: '3.3' }
          - { os: windows-latest,  platform: x64-mingw-ucrt,     ruby-version: '3.4' }
          - { os: windows-latest,  platform: x64-mingw-ucrt,     ruby-version: '4.0' }
          - { os: windows-11-arm,  platform: aarch64-mingw-ucrt, ruby-version: '3.4' }
          - { os: windows-11-arm,  platform: aarch64-mingw-ucrt, ruby-version: '4.0' }
          - { os: ubuntu-latest,   platform: x86_64-linux }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux }
          - { os: macos-latest,    platform: arm64-darwin }
          - { os: macos-15-intel,  platform: x86_64-darwin }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || github.ref }}

      # keep the platform floor at 11.0 regardless of runner macOS
      - run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
        if: runner.os == 'macOS'

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: ${{ matrix.ruby-version || '3.3' }}
          bundler-cache: true

      - name: Build this ruby minor's extension (Windows cells)
        if: runner.os == 'Windows'
        run: |
          command -v ninja >/dev/null 2>&1 || choco install -y ninja
          rake compile
        shell: bash

      - name: Build the platform gem
        if: runner.os != 'Windows'
        run: rake gem:native:${{ matrix.platform }}
        shell: bash

      - name: Upload extension cell
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: winext-${{ matrix.platform }}-${{ matrix.ruby-version }}
          path: |
            lib/teptris

      - name: Upload platform gem
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}
          path: pkg/*.gem

  assemble-windows:
    name: Assemble fat gem (${{ matrix.platform }})
    needs: [bump, build]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x64-mingw32,        minors: "3.0" }
          - { platform: x64-mingw-ucrt,     minors: "3.1 3.2 3.3 3.4 4.0" }
          - { platform: aarch64-mingw-ucrt, minors: "3.4 4.0" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || github.ref }}

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/download-artifact@v4
        with:
          pattern: winext-${{ matrix.platform }}-*
          path: lib/teptris
          merge-multiple: true

      - name: Verify every ruby minor made it
        run: |
          for v in ${{ matrix.minors }}; do
            test -f "lib/teptris/$v/teptris_ext.so" \
              || { echo "::error::missing ruby $v extension for ${{ matrix.platform }}"; exit 1; }
          done
          # static link: libteptris lives inside each teptris_ext.so
          test ! -f lib/libteptris.dll

      - run: bundle exec rake gem:pack:${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}
          path: pkg/*.gem

  build-musl:
    needs: bump
    if: always() && !cancelled() && !failure()
    runs-on: ${{ matrix.os }}
    # no `any` gem: no-fallback means the ext is mandatory (issue #7).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
            # 32-bit ARM has no runners: the container runs emulated
          - os: ubuntu-latest
            platform: arm-linux-musl
            qemu: linux/arm/v7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || github.ref }}

      - name: Ensure armv7 binfmt handlers
        if: matrix.qemu
        run: docker run --privileged --rm tonistiigi/binfmt --install arm

      # Musl builds in an Alpine container (JS actions stay on the host).
      - name: Build gem in Alpine container
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          QEMU: ${{ matrix.qemu }}
        run: |
          PLAT=""
          if [ -n "$QEMU" ]; then PLAT="--platform ${QEMU}"; fi
          docker run --rm $PLAT \
            -v "$PWD:/work" \
            -w /work \
            -e target_platform="${TARGET_PLATFORM}" \
            -e TEPTRIS_PGO=0 \
            ruby:3.3-alpine sh -c '
              set -eux
              # python3: the PGO stage generates the training corpus
              apk add --no-cache build-base bash curl ca-certificates git cmake make gcc g++ python3
              git config --global --add safe.directory /work
              bundle install --jobs 4 --retry 3
              bundle exec rake gem:native:"'"${TARGET_PLATFORM}"'"
            '

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}
          path: pkg/*.gem

  # 32-bit ARM glibc gem, emulated (no armv7 runners exist). PGO off:
  # profile training under qemu costs minutes for single-digit gains
  # on a tier where working-at-all is the goal.
  build-arm-gnu:
    name: Build arm-linux gem (qemu)
    needs: bump
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || github.ref }}

      - name: Ensure armv7 binfmt handlers
        run: docker run --privileged --rm tonistiigi/binfmt --install arm

      - name: Build gem in Ubuntu armv7 container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/work" -w /work \
            ubuntu:24.04 bash -c '
              set -eux
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                build-essential cmake curl ca-certificates ruby-full ruby-dev
              gem install rake --no-document
              git config --global --add safe.directory /work || true
              TEPTRIS_PGO=0 rake gem:native:arm-linux
            '

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-arm-linux
          path: pkg/*.gem

  publish:
    needs: [bump, build, build-musl, build-arm-gnu, assemble-windows, build-source]
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || github.ref }}

      # keep the platform floor at 11.0 regardless of runner macOS
      - run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
        if: runner.os == 'macOS'

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: pkg
          merge-multiple: true

      - name: Configure RubyGems credentials (Trusted Publishing / OIDC)
        uses: rubygems/configure-rubygems-credentials@main

      - name: Publish to rubygems.org
        run: |
          ls -la pkg/
          for gem in pkg/*.gem; do
            echo "Pushing $gem..."
            if ! output=$(gem push -V "$gem" 2>&1); then
              case "$output" in
                *"Repushing of gem versions is not allowed"*)
                  echo "::warning::$gem already published; skipping"
                  ;;
                *)
                  echo "$output"
                  exit 1
                  ;;
              esac
            else
              echo "$output"
            fi
          done
