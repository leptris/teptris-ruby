name: release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: 'Version to release (x.y.z or x.y.z.n lockstep {libteptris-semver}.{binding-patch}; or major/minor/patch). Empty = tag current VERSION.'
        type: string
        required: false

# contents: write pushes the version-bump commit + tag.
# id-token: write is required for RubyGems.org Trusted Publishing (OIDC).
permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch' && inputs.next_version != ''
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'

      - name: Bump version.rb
        id: bump
        shell: bash
        env:
          NEXT_VERSION: ${{ inputs.next_version }}
        run: |
          set -euo pipefail
          INPUT="${NEXT_VERSION}"
          if [[ "$INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            :
          elif [[ "$INPUT" == "major" || "$INPUT" == "minor" || "$INPUT" == "patch" ]]; then
            CURRENT=$(ruby -Ilib -rteptris/version -e 'puts Teptris::VERSION')
            IFS=. read -r MA MI PA QU <<< "$CURRENT"
            QU="${QU:-0}"
            case "$INPUT" in
              major) MA=$((MA + 1)); MI=0; PA=0; QU=0 ;;
              minor) MI=$((MI + 1)); PA=0; QU=0 ;;
              patch) QU=$((QU + 1)) ;;
            esac
            INPUT="${MA}.${MI}.${PA}.${QU}"
          else
            echo "::error::next_version must be x.y.z[.n] or major/minor/patch, got '${INPUT}'"
            exit 1
          fi
          echo "Releasing ${INPUT}"
          sed -i "s/VERSION = \".*\"/VERSION = \"${INPUT}\"/" lib/teptris/version.rb
          NEW_VERSION=$(ruby -Ilib -rteptris/version -e 'puts Teptris::VERSION')
          echo "new-version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/teptris/version.rb
          if git diff --cached --quiet; then
            echo "No version change; tagging current HEAD."
          else
            git commit -m "Bump teptris to ${NEW_VERSION}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fail fast on a leftover tag from a half-failed run
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new-version }}
        run: |
          # A prior run that failed after tagging leaves v<version>
          # behind; the push below then dies non-fast-forward and
          # starves the downstream jobs of artifacts (the 0.2.40
          # incident). Name the remedy instead.
          if git ls-remote --tags origin "v${NEW_VERSION}" | grep -q .; then
            echo "::error::tag v${NEW_VERSION} already exists. If no release/gems were published, delete it first:"
            echo "::error::  git push origin :refs/tags/v${NEW_VERSION}"
            exit 1
          fi

      - name: Push bump commit + tag
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new-version }}
        run: |
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          git tag "v${NEW_VERSION}" HEAD
          git push origin "v${NEW_VERSION}"

  # The ruby-platform source gem: the SAME mandatory native ext,
  # compiled at install by the user's own toolchain (#7's no-fallback
  # decision concerned the BINDING — never a slow pure-Ruby parser;
  # this still fails loudly without a C compiler). Covers every
  # platform the 8 prebuilt gems do not: FreeBSD/OpenBSD/Solaris,
  # armv7/riscv64/ppc64le, any-glibc Linux, Windows Ruby 3.0.  # every platform cell, fat assembly, and per-gem verification -
  # shared with release-dryrun.yml via workflow_call (jobs of a
  # called workflow run in THIS run; artifacts stay local)
  matrix:
    needs: bump
    if: always() && !cancelled() && !failure()
    uses: ./.github/workflows/release-matrix.yml
    with:
      ref: ${{ needs.bump.outputs.sha || github.ref }}

  publish:
    needs: [bump, matrix]
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha || github.ref }}

      # keep the platform floor at 11.0 regardless of runner macOS
      - run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
        if: runner.os == 'macOS'

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: pkg
          merge-multiple: true

      - name: Configure RubyGems credentials (Trusted Publishing / OIDC)
        uses: rubygems/configure-rubygems-credentials@main

      - name: Publish to rubygems.org
        run: |
          ls -la pkg/
          for gem in pkg/*.gem; do
            echo "Pushing $gem..."
            if ! output=$(gem push -V "$gem" 2>&1); then
              case "$output" in
                *"Repushing of gem versions is not allowed"*)
                  echo "::warning::$gem already published; skipping"
                  ;;
                *)
                  echo "$output"
                  exit 1
                  ;;
              esac
            else
              echo "$output"
            fi
          done
