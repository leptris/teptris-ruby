name: ractor-bench

# Measures Ractor-parallel batch loading on a quiet runner: sequential
# vs C load_batch vs the Ractor worker pool. workflow_dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    # 3.4 = the recorded-dead-end control (segfaulting yield(move:),
    # wedging copy-transfer, sequential-fastest); 4.0 = the recheck
    # cell - the ledger's explicit "recheck when CRuby stabilizes".
    name: ractor tier (ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.4', '4.0']
    steps:
      - uses: actions/checkout@v7
      - name: Checkout libteptris (bench corpus)
        uses: actions/checkout@v7
        with:
          repository: leptris/teptris
          path: libteptris-src
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - run: command -v ninja >/dev/null 2>&1 || sudo apt-get install -y ninja-build
      - run: rake compile
      - name: Generate the bench corpus
        run: python3 libteptris-src/scripts/gen_bench_corpus.py libteptris-src/bench-corpus
      - name: Ractor tier
        run: ruby benchmark/ractor_tier.rb libteptris-src/bench-corpus 40
