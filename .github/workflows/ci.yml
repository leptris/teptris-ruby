name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile-and-spec:
    name: ${{ matrix.os }} ruby ${{ matrix.ruby-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # one cell per PGO flavor + platform family: clang (darwin),
        # gcc ELF (ubuntu x64/arm), gcc mingw (windows x64/arm)
        include:
          - { os: macos-latest,      ruby-version: '3.3' }
          - { os: macos-15-intel,    ruby-version: '3.3' }
          - { os: ubuntu-latest,     ruby-version: '3.3' }
          - { os: ubuntu-24.04-arm,  ruby-version: '3.3' }
          - { os: windows-latest,    ruby-version: '3.4' }
          - { os: windows-11-arm,    ruby-version: '3.4' }
    steps:
      - uses: actions/checkout@v4

      - run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
        if: runner.os == 'macOS'

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Compile (two-stage PGO) + specs
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1 && command -v choco >/dev/null 2>&1; then
            choco install -y ninja
          fi
          rake compile
          bundle exec rspec --format progress

  # The musl flavor the release ships (alpine container): validates the
  # container build (PGO corpus generation, the sh -c quoting, the
  # gem:native musl rake path) BEFORE a release burns a version — the
  # 0.2.24 apostrophe bug lived exactly here.
  musl:
    name: musl (alpine, x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'

      - name: Compile + specs in Alpine container
        run: |
          docker run --rm             -v "$PWD:/work"             -w /work             ruby:3.3-alpine sh -c '
              set -eux
              apk add --no-cache build-base bash curl ca-certificates git cmake make gcc g++ python3
              git config --global --add safe.directory /work
              bundle install --jobs 4 --retry 3
              rake compile
              bundle exec rspec --format progress
            '

  # The ruby-platform source gem: mkmf compiles the vendored engine at
  # install time (the widest-support artifact — FreeBSD/Solaris/armv7/
  # riscv64/old-glibc/windows-3.0 all resolve to it). Proves the
  # extconf source path on every change, not when an exotic user
  # first needs it.
  source-gem:
    name: source gem (compiles at install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'
      - name: Build + install source gem + round-trip
        shell: bash
        run: |
          set -euxo pipefail
          rake gem:source
          gem install --verbose pkg/teptris-*.gem --no-document
          ruby -e 'require "teptris"; doc = Teptris::TOML.load("a = [1, {b = \"x\"}]\n[t]\nc = 1979-05-27T07:32:00Z\n"); dump = Teptris::TOML.dump(doc); abort "round-trip broken" unless dump.include?("1979-05-27") && dump.include?("x"); puts "source gem OK: engine #{Teptris::TOML.engine_version}"'
