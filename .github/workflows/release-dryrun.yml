# Exercise the full release matrix - build, assemble, verify -
# without bumping, tagging, or publishing. Dispatch on any branch to
# catch release-only breakage before it burns a version number.
name: release-dryrun

on:
  workflow_dispatch:
  # a PR that touches the release machinery rehearses the whole
  # matrix automatically - the 0.2.42 saga failed five real
  # dispatches before the dry-run existed
  pull_request:
    paths:
      - ".github/workflows/release-matrix.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-dryrun.yml"

permissions:
  contents: read
  actions: read  # release-matrix's assemble pulls ext artifacts by run id

concurrency:
  group: release-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    uses: ./.github/workflows/release-matrix.yml
    with:
      ref: ${{ github.sha }}
