# The release build matrix: build every platform cell, assemble the
# fat gems, verify every assembled gem (installed + round-tripped +
# doctrine halves). Called by release.yml (then publish) and by
# release-dryrun.yml (no version churn, no tags, no publish) - the
# dry-run exists because five 0.2.42-class dispatches failed at
# stages that only execute during a real release.
name: release-matrix

on:
  workflow_call:
    inputs:
      ref:
        description: 'commit to build (empty = the calling ref)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read  # assemble-fat's gh run download pulls ext artifacts

# no workflow-level concurrency here: reusable workflows may not
# declare one - the callers (release / release-dryrun) carry their
# own groups, and artifacts are per-run so parallel callers cannot
# collide
jobs:
  build-source:
    name: Build source gem
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'
      - run: rake gem:source
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-ruby-source
          path: pkg/*.gem

  build:
    if: always() && !cancelled() && !failure()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Batched per platform (#201-class wall fix): one cell builds the
    # engine ONCE (first minor, full PGO `rake compile`), then each
    # further minor gets an ext-only extconf+make against that engine
    # — the ext binds its minor either way, and the PGO-trained
    # archive is shared. Job count is the release wall under runner
    # contention: every job RUNS in 1.5-4 min; 20 cells -> 7.
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows: sequential setup-ruby per minor (the msys EEXIST
          # hazard is absorbed by continue-on-error, the leptris-ruby
          # pattern). mingw32 (3.0) and ucrt exts ride one runner.
          - { os: windows-latest,  platforms: "x64-mingw32 x64-mingw-ucrt" }
          - { os: windows-11-arm,  platforms: "aarch64-mingw-ucrt" }
          - { os: ubuntu-latest,   platforms: "x86_64-linux" }
          - { os: ubuntu-24.04-arm, platforms: "aarch64-linux" }
          - { os: macos-latest,    platforms: "arm64-darwin" }
          - { os: macos-15-intel,  platforms: "x86_64-darwin" }
    env:
      # minors per platform, mirroring the assemble-fat table
      MINORS_DEFAULT: "3.3 3.4 4.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
        if: runner.os == 'macOS'

      - name: Resolve the minor list
        shell: bash
        run: |
          case "${{ matrix.platforms }}" in
            *x64-mingw-ucrt*) MINORS="3.3 3.4 4.0" ;;
            *) MINORS="$MINORS_DEFAULT" ;;
          esac
          # mingw32's 3.0 rides the windows-x64 cell as its own gem
          if [ "${{ matrix.os }}" = "windows-latest" ]; then MINORS="3.0 3.1 3.2 3.3 3.4 4.0"; fi
          echo "MINORS=$MINORS" >> "$GITHUB_ENV"
          echo "ENGINE_VER=$(grep -o 'LIBTEPTRIS_VERSION = "[^"]*"' Rakefile | cut -d'"' -f2)" >> "$GITHUB_ENV"

      # first minor: full engine (PGO) + ext build via rake
      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build engine + first minor ext (3.3)
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            command -v ninja >/dev/null 2>&1 || choco install -y ninja
          fi
          rake compile
        shell: bash

      # remaining minors: ext-only against the built engine. On unix
      # the engine tree lives at tmp/libteptris-$VER; on windows
      # rake compile is per-minor (setup-ruby swap, engine rebuild —
      # MSVC's PGO train does not cache as cleanly).
      - name: Build remaining unix minors (ext-only)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux
          ROOT="$PWD"
          ENG="tmp/libteptris-${ENGINE_VER}"
          test -f "$ENG/src/libteptris.a" || test -f "$ENG/src/teptris.lib" || {
            ls -la "$ENG/src" || true; echo "::error::engine archive not found at $ENG/src"; exit 1; }
          for v in $MINORS; do
            [ "$v" = "3.3" ] && continue   # built by rake compile above
            ( cd ext/teptris_ext \
              && rm -f Makefile teptris_ext.so teptris_ext.bundle teptris_ext.dll ./*.o \
              && ruby extconf.rb --with-teptris-libdir="$ROOT/$ENG/src" \
                                --with-teptris-include="$ROOT/$ENG/src/include" \
              && make )
            mkdir -p "lib/teptris/$v"
            cp ext/teptris_ext/teptris_ext.* "lib/teptris/$v/"
          done
          find lib/teptris -mindepth 1 -maxdepth 2 -ls

      # windows per-minor sequential setup (EEXIST-safe)
      - uses: ruby/setup-ruby@master
        if: runner.os == 'Windows' && contains(matrix.platforms, 'x64-mingw-ucrt')
        with: { ruby-version: '3.1', bundler-cache: false }
        continue-on-error: true
      - name: win ext 3.1
        if: runner.os == 'Windows' && contains(matrix.platforms, 'x64-mingw-ucrt')
        shell: bash
        run: |
          rake compile
          ls lib/teptris/3.1/
      - uses: ruby/setup-ruby@master
        if: runner.os == 'Windows' && contains(matrix.platforms, 'x64-mingw-ucrt')
        with: { ruby-version: '3.2', bundler-cache: false }
        continue-on-error: true
      - name: win ext 3.2
        if: runner.os == 'Windows' && contains(matrix.platforms, 'x64-mingw-ucrt')
        shell: bash
        run: |
          rake compile
          ls lib/teptris/3.2/
      - uses: ruby/setup-ruby@master
        if: runner.os == 'Windows' && contains(matrix.platforms, 'x64-mingw-ucrt')
        with: { ruby-version: '3.4', bundler-cache: false }
        continue-on-error: true
      - name: win ext 3.4
        if: runner.os == 'Windows' && contains(matrix.platforms, 'x64-mingw-ucrt')
        shell: bash
        run: |
          rake compile
          ls lib/teptris/3.4/
      - uses: ruby/setup-ruby@master
        if: runner.os == 'Windows' && contains(matrix.platforms, 'x64-mingw-ucrt')
        with: { ruby-version: '4.0', bundler-cache: false }
        continue-on-error: true
      - name: win ext 4.0
        if: runner.os == 'Windows' && contains(matrix.platforms, 'x64-mingw-ucrt')
        shell: bash
        run: |
          rake compile
          ls lib/teptris/4.0/
      - uses: ruby/setup-ruby@master
        if: runner.os == 'Windows' && contains(matrix.platforms, 'x64-mingw32')
        with: { ruby-version: '3.0', bundler-cache: false }
        continue-on-error: true
      - name: win ext 3.0 (mingw32)
        if: runner.os == 'Windows' && contains(matrix.platforms, 'x64-mingw32')
        shell: bash
        run: |
          rake compile
          ls lib/teptris/3.0/
          # stage ONLY the 3.0 ext: the mingw32 gem must not carry the
          # ucrt minors built above (snapshot hygiene)
          rm -rf /tmp/mingw32-stage && mkdir -p /tmp/mingw32-stage
          cp -R lib/teptris/3.0 /tmp/mingw32-stage/
      - name: Upload x64-mingw32 exts
        if: contains(matrix.platforms, 'x64-mingw32')
        uses: actions/upload-artifact@v4
        with:
          name: ext-x64-mingw32
          path: /tmp/mingw32-stage

      # ucrt artifact FIRST: the mingw32 (3.0) build below adds an
      # msvcrt-binding ext to lib/teptris — the ucrt gem must not
      # carry it (upload snapshots lib/teptris at THIS point).
      - name: Upload x64-mingw-ucrt exts
        if: contains(matrix.platforms, 'x64-mingw-ucrt')
        uses: actions/upload-artifact@v4
        with:
          name: ext-x64-mingw-ucrt
          path: lib/teptris
      - name: Upload aarch64-mingw-ucrt exts
        if: contains(matrix.platforms, 'aarch64-mingw-ucrt')
        uses: actions/upload-artifact@v4
        with:
          name: ext-aarch64-mingw-ucrt
          path: lib/teptris
      - name: Upload unix exts (${{ matrix.platforms }})
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ext-${{ matrix.platforms }}
          path: lib/teptris

  assemble-fat:
    name: Assemble fat gems (${{ matrix.group }})
    needs: [build, build-musl]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Batched (#201-class wall fix): two cells loop their platform
    # lists — packing is pure file assembly, the split keeps one
    # slot per half instead of twelve. lib/teptris is wiped between
    # platforms so no cell's exts can leak into the next gem (the
    # 0.2.40 contamination class; verify-gems would catch it, the
    # wipe means it cannot form).
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: native
            platforms: "x86_64-linux aarch64-linux x86_64-darwin arm64-darwin x64-mingw32 x64-mingw-ucrt"
          - group: emulated
            platforms: "aarch64-mingw-ucrt arm-linux powerpc64le-linux s390x-linux x86_64-linux-musl aarch64-linux-musl"
    env:
      MINORS_BY_PLATFORM: "x64-mingw32:3.0 x64-mingw-ucrt:3.1_3.2_3.3_3.4_4.0 aarch64-mingw-ucrt:3.4_4.0 x86_64-linux:3.3_3.4_4.0 aarch64-linux:3.3_3.4_4.0 x86_64-linux-musl:3.3_3.4_4.0 aarch64-linux-musl:3.3_3.4_4.0 arm-linux:3.3_3.4_4.0 powerpc64le-linux:3.3_3.4_4.0 s390x-linux:3.3_3.4_4.0 x86_64-darwin:3.3_3.4_4.0 arm64-darwin:3.3_3.4_4.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Assemble each platform gem
        shell: bash
        run: |
          set -eux
          for plat in ${{ matrix.platforms }}; do
            # wipe any earlier platform's exts — no cross-gem leaks
            rm -rf lib/teptris/3.* lib/teptris/4.0 lib/teptris/*.so lib/teptris/*.bundle 2>/dev/null || true
            pattern="ext-${plat}"
            if echo "$plat" | grep -q musl; then pattern="muslext-${plat}"; fi
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts" > /dev/null 2>&1 || true
            mkdir -p lib/teptris
            # exact-name download (batched cells upload one artifact
            # per platform; the old ext-<plat>-* glob matched musl
            # against glibc names — the 0.2.40 lesson)
            if ! gh run download "${{ github.run_id }}" -n "$pattern" -D /tmp/ext-dl; then
              echo "::error::artifact $pattern missing for $plat"; exit 1
            fi
            cp -R /tmp/ext-dl/* lib/teptris/ 2>/dev/null || { ls -la /tmp/ext-dl; echo "::error::empty ext artifact for $plat"; exit 1; }
            rm -rf /tmp/ext-dl
            minors=$(printf '%s\n' "$MINORS_BY_PLATFORM" | tr ' ' '\n' | sed -n "s/^${plat}://p" | tr '_' ' ')
            for v in $minors; do
              test -f "lib/teptris/$v/teptris_ext.so" \
                -o -f "lib/teptris/$v/teptris_ext.bundle" \
                || { echo "::error::missing ruby $v extension for $plat"; ls -laR lib/teptris; exit 1; }
            done
            bundle exec rake gem:pack:$plat
            mkdir -p "/tmp/pkg-$plat"
            mv pkg/*.gem "/tmp/pkg-$plat/"
          done
          mkdir -p pkg
          for plat in ${{ matrix.platforms }}; do
            cp "/tmp/pkg-$plat"/*.gem pkg/
          done
          ls -la pkg/
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.group }}
          path: pkg/*.gem

  build-musl:
    if: always() && !cancelled() && !failure()
    runs-on: ${{ matrix.os }}
    # no `any` gem: no-fallback means the ext is mandatory (issue #7).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: x86_64-linux-musl
            minors: "3.3 3.4 4.0"
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
            minors: "3.3 3.4 4.0"
            # 32-bit ARM has no runners: the container runs emulated
          - os: ubuntu-latest
            platform: arm-linux-musl
            qemu: linux/arm/v7
          # IBM Z musl (alpine still ships ruby for s390x): single-minor
          # 3.3 - alpine's ruby 3.4+/4.0 images for s390x are not
          # published, and one more emulated tier-3 gem beats none
          - os: ubuntu-latest
            platform: s390x-linux-musl
            qemu: linux/s390x
            image_override: ruby:3.3-alpine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Ensure binfmt handlers
        if: matrix.qemu
        run: docker run --privileged --rm tonistiigi/binfmt --install arm,s390x

      # Native musl platforms build one extension per ruby minor
      # (fat layout; assemble-fat packs). Emulated armv7 keeps the
      # single-minor gem — tripling qemu builds for one tier is not
      # worth the release wall time.
      - name: Build each ruby minor's extension (Alpine, native)
        if: matrix.minors
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          MINORS: ${{ matrix.minors }}
        run: |
          for v in $MINORS; do
            docker run --rm \
              -v "${PWD}:/work" \
              -w /work \
              -e TEPTRIS_PGO=0 \
              "ruby:${v}-alpine" sh -c '
                set -eux
                apk add --no-cache build-base bash curl ca-certificates git cmake make gcc g++ python3
                git config --global --add safe.directory /work
                bundle install --jobs 4 --retry 3
                bundle exec rake compile
              '
          done
          find lib/teptris -mindepth 1 -maxdepth 2 -lsteptris_ext.so

      - name: Upload extension cells
        if: matrix.minors
        uses: actions/upload-artifact@v4
        with:
          # muslext-* namespace: assemble-fat's glibc downloads glob
          # ext-<platform>-* and an ext-x86_64-linux-musl-* name
          # matches ext-x86_64-linux-* — 0.2.40 merged MUSL exts over
          # the glibc gems' own this way
          name: muslext-${{ matrix.platform }}
          path: |
            lib/teptris

      # Musl builds in an Alpine container (JS actions stay on the host).
      - name: Build gem in Alpine container
        if: ${{ !matrix.minors }}
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          QEMU: ${{ matrix.qemu }}
          IMAGE_OVERRIDE: ${{ matrix.image_override || '' }}
        run: |
          PLAT=()
          if [ -n "$QEMU" ]; then PLAT=(--platform "$QEMU"); fi
          docker run --rm "${PLAT[@]}" \
            -v "${PWD}:/work" \
            -w /work \
            -e target_platform="${TARGET_PLATFORM}" \
            -e TEPTRIS_PGO=0 \
            ruby:3.3-alpine sh -c '
              set -eux
              # python3: the PGO stage generates the training corpus
              apk add --no-cache build-base bash curl ca-certificates git cmake make gcc g++ python3
              git config --global --add safe.directory /work
              bundle install --jobs 4 --retry 3
              bundle exec rake gem:native:"'"${TARGET_PLATFORM}"'"
            '

      - uses: actions/upload-artifact@v4
        if: ${{ !matrix.minors }}
        with:
          name: pkg-${{ matrix.platform }}
          path: pkg/*.gem

  # Emulated tier (no runners): armv7, POWER8+, IBM Z. The official
  # ruby images ship arm/ppc64le/s390x for 3.3/3.4/4.0, so the fat
  # layout extends here too - one cell per platform x minor, each
  # contributing its ext to assemble-fat. Bookworm (glibc 2.36) also
  # LOWERS the floor the ubuntu:24.04 cells (2.39) had built on.
  # PGO off: training under qemu costs minutes for single-digit gains
  # on tiers where working-at-all is the goal.
  build-qemu:
    name: Build ${{ matrix.platform }} exts (qemu)
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Batched per platform (#201-class wall fix): the three minors
    # loop inside one cell — binfmt is installed once, one queue slot
    # instead of three. PGO off: training under qemu costs minutes
    # for single-digit gains on tiers where working-at-all is the goal.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: arm-linux,         qemu: linux/arm/v7,  distro: "-bookworm" }
          - { platform: powerpc64le-linux, qemu: linux/ppc64le, distro: "-bookworm" }
          # bookworm ruby images carry arm + ppc64le but NOT s390x;
          # the plain tags (trixie) do
          - { platform: s390x-linux,       qemu: linux/s390x,   distro: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Ensure binfmt handlers
        run: docker run --privileged --rm tonistiigi/binfmt --install arm,ppc64le,s390x

      - name: Build each ruby minor's extension
        run: |
          set -eux
          for v in 3.3 3.4 4.0; do
            docker run --rm --platform "${{ matrix.qemu }}" \
              -v "${PWD}:/work" -w /work \
              -e TEPTRIS_PGO=0 \
              "ruby:${v}${{ matrix.distro }}" bash -c '
                set -eux
                apt-get update -qq
                apt-get install -y --no-install-recommends cmake make gcc g++ git python3 curl ca-certificates >/dev/null
                git config --global --add safe.directory /work || true
                gem install rake --no-document
                rake compile
              '
            ls -la "lib/teptris/$v/"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ext-${{ matrix.platform }}
          path: |
            lib/teptris

  # Pre-publish gate: install every ASSEMBLED gem locally and
  # round-trip it on the platform family it targets. Every broken-gem
  # incident so far (musl exts layered over glibc gems by an artifact
  # glob, per-minor dirs missing) fails HERE instead of shipping. The
  # emulated tier (armv7/ppc64le/s390x/aarch64-linux) stays covered
  # by the smoke lane the release triggers right after publishing.
  verify-gems:
    needs: [build-source, build, assemble-fat, build-musl, build-qemu]
    if: always() && !cancelled() && !failure()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Pre-publish gate: install every ASSEMBLED gem locally and
    # round-trip it on the platform family it targets. Batched per
    # OS/arch (#201-class wall fix): the minors loop inside the cell
    # via sequential setup-ruby — the fat gem's per-minor exts are
    # proven by running the SAME gem under each minor. Every
    # broken-gem incident so far (musl exts layered over glibc gems
    # by an artifact glob, per-minor dirs missing) fails HERE instead
    # of shipping. The emulated tier stays covered by the smoke lane
    # the release triggers right after publishing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,    kind: darwin-arm,   suffix: arm64-darwin }
          - { os: macos-15-intel,  kind: darwin-x64,   suffix: x86_64-darwin }
          - { os: windows-latest,  kind: windows-x64,  suffix: x64-mingw-ucrt }
          - { os: windows-11-arm,  kind: windows-arm,  suffix: aarch64-mingw-ucrt }
          # the linux cell verifies EVERYTHING cheap in containers:
          # glibc + musl fat minors, and the source gem compile; it
          # also carries the cross-variant Ruby-source parity gate
          - { os: ubuntu-latest,   kind: linux-all,    suffix: linux-all }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: pkg
          merge-multiple: true

      - name: Verify Ruby-source parity across platform variants
        if: matrix.kind == 'linux-all'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/parity && mkdir -p /tmp/parity
          valid=0
          for gem in pkg/*.gem; do
            name=$(basename "$gem" .gem)
            # a .gem's OUTER container is a plain POSIX tar, not gzip
            if ! tar tf "$gem" >/dev/null 2>&1; then
              echo "::warning::$name is not a readable gem archive — skipping parity for it"
              continue
            fi
            d="/tmp/parity/$name"
            mkdir -p "$d"
            tar xf "$gem" -C "$d" data.tar.gz
            tar xf "$d/data.tar.gz" -C "$d"
            # EOL-normalize before hashing: the README contract is
            # "byte-identical EOLs aside" — the mingw cells package
            # CRLF sources, everything else LF.
            find "$d/lib" -name '*.rb' -type f -exec sh -c \
              'tr -d "\r" < "$1" > "$1.norm" && mv "$1.norm" "$1"' _ {} \;
            find "$d/lib" -name '*.rb' -type f | sed "s|$d/||" | sort > "$d/list.txt"
            valid=$((valid + 1))
          done
          if [ "$valid" -lt 2 ]; then
            echo "::error::fewer than two valid variants to compare"
            exit 1
          fi
          first=$(cd /tmp/parity && set -- * && echo "$1")
          ref_list="/tmp/parity/$first/list.txt"
          ref_hashes=$(cd "/tmp/parity/$first" && xargs md5sum < list.txt | sort -k2)
          for d in /tmp/parity/*/; do
            name=$(basename "$d")
            [ "$name" = "$first" ] && continue
            diff -q "$ref_list" "$d/list.txt" >/dev/null || {
              echo "::error::$name ships a different lib/**/*.rb file set than $first"
              exit 1
            }
            hashes=$(cd "$d" && xargs md5sum < list.txt | sort -k2)
            diff -q <(echo "$ref_hashes") <(echo "$hashes") >/dev/null || {
              echo "::error::$name Ruby sources differ from $first (version skew)"
              exit 1
            }
          done
          echo "Ruby sources byte-identical across $valid variants"

      - name: Verify the glibc + musl fat gems and the source gem
        if: matrix.kind == 'linux-all'
        shell: bash
        run: |
          set -eux
          ls pkg/
          verify() {
            local image="$1" gem="$2" setup="$3"
            docker run --rm -v "$PWD:/w" -w /w "$image" sh -c "
              set -eux
              $setup
              gem install --local $gem --no-document
              ruby scripts/gem_verify.rb"
          }
          for v in 3.3 3.4 4.0; do
            verify "ruby:${v}-bookworm" "pkg/teptris-*-x86_64-linux.gem" \
              "apt-get update -qq >/dev/null && apt-get install -y -qq make gcc g++ cmake >/dev/null"
            verify "ruby:${v}-alpine" "pkg/teptris-*-x86_64-linux-musl.gem" \
              "apk add --no-cache build-base make gcc g++ cmake >/dev/null"
          done
          docker run --rm -v "$PWD:/w" -w /w ruby:3.3-bookworm sh -c '
            set -eux
            apt-get update -qq >/dev/null && apt-get install -y -qq make gcc g++ cmake >/dev/null
            # ruby-platform gems carry no platform suffix in the FILE name
            srcgem=$(ls pkg/teptris-*.gem | grep -E 'teptris-[0-9.]+\.gem$')
            gem install --local "$srcgem" --no-document
            ruby scripts/gem_verify.rb'

      # host cells: loop minors, install the SAME fat gem under each
      - name: install+verify helper
        if: matrix.kind != 'linux-all'
        shell: bash
        run: |
          cat > /tmp/vcell.sh <<'SH'
          set -eux
          gem="$1"
          gem install --local "$gem" --force --no-document
          ruby scripts/gem_verify.rb
          gem uninstall teptris -a -x --force || true
          SH

      - uses: ruby/setup-ruby@master
        if: matrix.kind != 'linux-all'
