# The release build matrix: build every platform cell, assemble the
# fat gems, verify every assembled gem (installed + round-tripped +
# doctrine halves). Called by release.yml (then publish) and by
# release-dryrun.yml (no version churn, no tags, no publish) - the
# dry-run exists because five 0.2.42-class dispatches failed at
# stages that only execute during a real release.
name: release-matrix

on:
  workflow_call:
    inputs:
      ref:
        description: 'commit to build (empty = the calling ref)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# no workflow-level concurrency here: reusable workflows may not
# declare one - the callers (release / release-dryrun) carry their
# own groups, and artifacts are per-run so parallel callers cannot
# collide
jobs:
  build-source:
    name: Build source gem
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'
      - run: rake gem:source
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-ruby-source
          path: pkg/*.gem

  build:
    if: always() && !cancelled() && !failure()
    runs-on: ${{ matrix.os }}
    # precompiled cells: the ext ships built (PGO); no runtime fallback
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: ucrt rubies bind x64-ucrt-rubyNNN.dll per minor, so
          # each cell builds ONE minor's extension; assemble-fat packs
          # them into a fat gem (nokogiri layout). RubyInstaller ARM64
          # builds exist only for 3.4 and 4.0; 3.0 is the last mingw32
          # (msvcrt) line.
          - { os: windows-latest,  platform: x64-mingw32,        ruby-version: '3.0' }
          - { os: windows-latest,  platform: x64-mingw-ucrt,     ruby-version: '3.1' }
          - { os: windows-latest,  platform: x64-mingw-ucrt,     ruby-version: '3.2' }
          - { os: windows-latest,  platform: x64-mingw-ucrt,     ruby-version: '3.3' }
          - { os: windows-latest,  platform: x64-mingw-ucrt,     ruby-version: '3.4' }
          - { os: windows-latest,  platform: x64-mingw-ucrt,     ruby-version: '4.0' }
          - { os: windows-11-arm,  platform: aarch64-mingw-ucrt, ruby-version: '3.4' }
          - { os: windows-11-arm,  platform: aarch64-mingw-ucrt, ruby-version: '4.0' }
          # Unix fat cells: one per ruby minor per platform — a unix
          # .so binds the minor that built it (a 3.3-built ext failed
          # dlopen under ruby 4.0 with the gem installed). assemble-fat
          # packs 3.3/3.4/4.0 into one gem; older minors install the
          # source gem, which compiles at install.
          - { os: ubuntu-latest,   platform: x86_64-linux,  ruby-version: '3.3' }
          - { os: ubuntu-latest,   platform: x86_64-linux,  ruby-version: '3.4' }
          - { os: ubuntu-latest,   platform: x86_64-linux,  ruby-version: '4.0' }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux, ruby-version: '3.3' }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux, ruby-version: '3.4' }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux, ruby-version: '4.0' }
          - { os: macos-latest,    platform: arm64-darwin,  ruby-version: '3.3' }
          - { os: macos-latest,    platform: arm64-darwin,  ruby-version: '3.4' }
          - { os: macos-latest,    platform: arm64-darwin,  ruby-version: '4.0' }
          - { os: macos-15-intel,  platform: x86_64-darwin, ruby-version: '3.3' }
          - { os: macos-15-intel,  platform: x86_64-darwin, ruby-version: '3.4' }
          - { os: macos-15-intel,  platform: x86_64-darwin, ruby-version: '4.0' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # keep the platform floor at 11.0 regardless of runner macOS
      - run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
        if: runner.os == 'macOS'

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: ${{ matrix.ruby-version || '3.3' }}
          bundler-cache: true

      - name: Build this ruby minor's extension
        if: runner.os == 'Windows'
        run: |
          command -v ninja >/dev/null 2>&1 || choco install -y ninja
          rake compile
        shell: bash

      - name: Build this ruby minor's extension (unix)
        if: runner.os != 'Windows'
        run: rake compile
        shell: bash

      - name: Upload extension cell
        uses: actions/upload-artifact@v4
        with:
          name: ext-${{ matrix.platform }}-${{ matrix.ruby-version }}
          path: |
            lib/teptris

  assemble-fat:
    name: Assemble fat gem (${{ matrix.platform }})
    needs: [build, build-musl]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x64-mingw32,        minors: "3.0" }
          - { platform: x64-mingw-ucrt,     minors: "3.1 3.2 3.3 3.4 4.0" }
          - { platform: aarch64-mingw-ucrt, minors: "3.4 4.0" }
          - { platform: x86_64-linux,       minors: "3.3 3.4 4.0" }
          - { platform: aarch64-linux,      minors: "3.3 3.4 4.0" }
          - { platform: x86_64-linux-musl,  minors: "3.3 3.4 4.0" }
          - { platform: aarch64-linux-musl, minors: "3.3 3.4 4.0" }
          - { platform: arm-linux,          minors: "3.3 3.4 4.0" }
          - { platform: powerpc64le-linux,  minors: "3.3 3.4 4.0" }
          - { platform: s390x-linux,        minors: "3.3 3.4 4.0" }
          - { platform: x86_64-darwin,      minors: "3.3 3.4 4.0" }
          - { platform: arm64-darwin,       minors: "3.3 3.4 4.0" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/download-artifact@v4
        with:
          # glibc platforms glob their per-minor ext-<platform>-<minor>
          # cells; musl platforms pull their single muslext artifact
          pattern: ${{ contains(matrix.platform, 'musl') && format('muslext-{0}', matrix.platform) || format('ext-{0}-*', matrix.platform) }}
          path: lib/teptris
          merge-multiple: true

      - name: Verify every ruby minor made it
        run: |
          # darwin compiles teptris_ext.bundle; linux/windows .so
          for v in ${{ matrix.minors }}; do
            test -f "lib/teptris/$v/teptris_ext.so" \
              -o -f "lib/teptris/$v/teptris_ext.bundle" \
              || { echo "::error::missing ruby $v extension for ${{ matrix.platform }}"; exit 1; }
          done
          # static link: libteptris lives inside each teptris_ext.so
          test ! -f lib/libteptris.dll

      - run: bundle exec rake gem:pack:${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}
          path: pkg/*.gem

  build-musl:
    if: always() && !cancelled() && !failure()
    runs-on: ${{ matrix.os }}
    # no `any` gem: no-fallback means the ext is mandatory (issue #7).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: x86_64-linux-musl
            minors: "3.3 3.4 4.0"
          - os: ubuntu-24.04-arm
            platform: aarch64-linux-musl
            minors: "3.3 3.4 4.0"
            # 32-bit ARM has no runners: the container runs emulated
          - os: ubuntu-latest
            platform: arm-linux-musl
            qemu: linux/arm/v7
          # IBM Z musl (alpine still ships ruby for s390x): single-minor
          # 3.3 - alpine's ruby 3.4+/4.0 images for s390x are not
          # published, and one more emulated tier-3 gem beats none
          - os: ubuntu-latest
            platform: s390x-linux-musl
            qemu: linux/s390x
            image_override: ruby:3.3-alpine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Ensure binfmt handlers
        if: matrix.qemu
        run: docker run --privileged --rm tonistiigi/binfmt --install arm,s390x

      # Native musl platforms build one extension per ruby minor
      # (fat layout; assemble-fat packs). Emulated armv7 keeps the
      # single-minor gem — tripling qemu builds for one tier is not
      # worth the release wall time.
      - name: Build each ruby minor's extension (Alpine, native)
        if: matrix.minors
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          MINORS: ${{ matrix.minors }}
        run: |
          for v in $MINORS; do
            docker run --rm \
              -v "${PWD}:/work" \
              -w /work \
              -e TEPTRIS_PGO=0 \
              "ruby:${v}-alpine" sh -c '
                set -eux
                apk add --no-cache build-base bash curl ca-certificates git cmake make gcc g++ python3
                git config --global --add safe.directory /work
                bundle install --jobs 4 --retry 3
                bundle exec rake compile
              '
          done
          ls -la lib/teptris/*/teptris_ext.so

      - name: Upload extension cells
        if: matrix.minors
        uses: actions/upload-artifact@v4
        with:
          # muslext-* namespace: assemble-fat's glibc downloads glob
          # ext-<platform>-* and an ext-x86_64-linux-musl-* name
          # matches ext-x86_64-linux-* — 0.2.40 merged MUSL exts over
          # the glibc gems' own this way
          name: muslext-${{ matrix.platform }}
          path: |
            lib/teptris

      # Musl builds in an Alpine container (JS actions stay on the host).
      - name: Build gem in Alpine container
        if: ${{ !matrix.minors }}
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          QEMU: ${{ matrix.qemu }}
          IMAGE_OVERRIDE: ${{ matrix.image_override || '' }}
        run: |
          PLAT=()
          if [ -n "$QEMU" ]; then PLAT=(--platform "$QEMU"); fi
          docker run --rm "${PLAT[@]}" \
            -v "${PWD}:/work" \
            -w /work \
            -e target_platform="${TARGET_PLATFORM}" \
            -e TEPTRIS_PGO=0 \
            ruby:3.3-alpine sh -c '
              set -eux
              # python3: the PGO stage generates the training corpus
              apk add --no-cache build-base bash curl ca-certificates git cmake make gcc g++ python3
              git config --global --add safe.directory /work
              bundle install --jobs 4 --retry 3
              bundle exec rake gem:native:"'"${TARGET_PLATFORM}"'"
            '

      - uses: actions/upload-artifact@v4
        if: ${{ !matrix.minors }}
        with:
          name: pkg-${{ matrix.platform }}
          path: pkg/*.gem

  # Emulated tier (no runners): armv7, POWER8+, IBM Z. The official
  # ruby images ship arm/ppc64le/s390x for 3.3/3.4/4.0, so the fat
  # layout extends here too - one cell per platform x minor, each
  # contributing its ext to assemble-fat. Bookworm (glibc 2.36) also
  # LOWERS the floor the ubuntu:24.04 cells (2.39) had built on.
  # PGO off: training under qemu costs minutes for single-digit gains
  # on tiers where working-at-all is the goal.
  build-qemu:
    name: Build ${{ matrix.platform }} ext (qemu, ruby ${{ matrix.ruby }})
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: arm-linux,         qemu: linux/arm/v7, ruby: "3.3", distro: "-bookworm" }
          - { platform: arm-linux,         qemu: linux/arm/v7, ruby: "3.4", distro: "-bookworm" }
          - { platform: arm-linux,         qemu: linux/arm/v7, ruby: "4.0", distro: "-bookworm" }
          - { platform: powerpc64le-linux, qemu: linux/ppc64le, ruby: "3.3", distro: "-bookworm" }
          - { platform: powerpc64le-linux, qemu: linux/ppc64le, ruby: "3.4", distro: "-bookworm" }
          - { platform: powerpc64le-linux, qemu: linux/ppc64le, ruby: "4.0", distro: "-bookworm" }
          # bookworm ruby images carry arm + ppc64le but NOT s390x;
          # the plain tags (trixie) do
          - { platform: s390x-linux,       qemu: linux/s390x, ruby: "3.3", distro: "" }
          - { platform: s390x-linux,       qemu: linux/s390x, ruby: "3.4", distro: "" }
          - { platform: s390x-linux,       qemu: linux/s390x, ruby: "4.0", distro: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Ensure binfmt handlers
        run: docker run --privileged --rm tonistiigi/binfmt --install arm,ppc64le,s390x

      - name: Build this ruby minor's extension
        run: |
          docker run --rm --platform "${{ matrix.qemu }}" \
            -v "${PWD}:/work" -w /work \
            -e TEPTRIS_PGO=0 \
            ruby:${{ matrix.ruby }}${{ matrix.distro }} bash -c '
              set -eux
              apt-get update -qq
              apt-get install -y --no-install-recommends cmake make gcc g++ git python3 curl ca-certificates >/dev/null
              git config --global --add safe.directory /work || true
              gem install rake --no-document
              rake compile
            '
          ls -la lib/teptris/${{ matrix.ruby }}/

      - uses: actions/upload-artifact@v4
        with:
          name: ext-${{ matrix.platform }}-${{ matrix.ruby }}
          path: |
            lib/teptris

  # Pre-publish gate: install every ASSEMBLED gem locally and
  # round-trip it on the platform family it targets. Every broken-gem
  # incident so far (musl exts layered over glibc gems by an artifact
  # glob, per-minor dirs missing) fails HERE instead of shipping. The
  # emulated tier (armv7/ppc64le/s390x/aarch64-linux) stays covered
  # by the smoke lane the release triggers right after publishing.
  verify-gems:
    needs: [build-source, build, assemble-fat, build-musl, build-qemu]
    if: always() && !cancelled() && !failure()
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # one cell per fat platform x ruby minor (host runner ruby)
          - { os: macos-latest,    suffix: arm64-darwin,  ruby: '3.3' }
          - { os: macos-latest,    suffix: arm64-darwin,  ruby: '3.4' }
          - { os: macos-latest,    suffix: arm64-darwin,  ruby: '4.0' }
          - { os: macos-15-intel,  suffix: x86_64-darwin, ruby: '3.3' }
          - { os: macos-15-intel,  suffix: x86_64-darwin, ruby: '3.4' }
          - { os: macos-15-intel,  suffix: x86_64-darwin, ruby: '4.0' }
          - { os: windows-latest,  suffix: x64-mingw-ucrt,     ruby: '3.3' }
          - { os: windows-latest,  suffix: x64-mingw-ucrt,     ruby: '3.4' }
          - { os: windows-latest,  suffix: x64-mingw-ucrt,     ruby: '4.0' }
          - { os: windows-latest,  suffix: x64-mingw32,        ruby: '3.0' }
          - { os: windows-11-arm,  suffix: aarch64-mingw-ucrt, ruby: '3.4' }
          - { os: windows-11-arm,  suffix: aarch64-mingw-ucrt, ruby: '4.0' }
          # the linux cell verifies EVERYTHING cheap in containers:
          # glibc + musl fat minors, and the source gem compile
          - { os: ubuntu-latest,   suffix: linux-all,        ruby: '3.3' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: pkg
          merge-multiple: true

      # the per-minor cells MUST run under their minor - the fat gem
      # only loads the ext built for the running ruby
      - uses: ruby/setup-ruby@v1
        if: matrix.suffix != 'linux-all'
        with:
          ruby-version: ${{ matrix.ruby }}

      # The leptris-ruby pattern's skew gate: every variant must ship
      # byte-identical lib/**/*.rb. A diff means one cell packaged from
      # a different source state (the #318 class — a mingw-only
      # Ruby/natives mismatch surfaced as NameErrors in host apps; the
      # per-gem round-trips above cannot catch it because each install
      # validates against its OWN sources).
      - name: Verify Ruby-source parity across platform variants
        if: matrix.suffix == 'linux-all'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/parity && mkdir -p /tmp/parity
          valid=0
          for gem in pkg/*.gem; do
            name=$(basename "$gem" .gem)
            # a .gem's OUTER container is a plain POSIX tar, not gzip
            if ! tar tf "$gem" >/dev/null 2>&1; then
              echo "::warning::$name is not a readable gem archive — skipping parity for it"
              continue
            fi
            d="/tmp/parity/$name"
            mkdir -p "$d"
            tar xf "$gem" -C "$d" data.tar.gz
            tar xf "$d/data.tar.gz" -C "$d"
            find "$d/lib" -name '*.rb' -type f | sed "s|$d/||" | sort > "$d/list.txt"
            valid=$((valid + 1))
          done
          if [ "$valid" -lt 2 ]; then
            echo "::error::fewer than two valid variants to compare"
            exit 1
          fi
          first=$(cd /tmp/parity && set -- * && echo "$1")
          ref_list="/tmp/parity/$first/list.txt"
          ref_hashes=$(cd "/tmp/parity/$first" && xargs md5sum < list.txt | sort -k2)
          for d in /tmp/parity/*/; do
            name=$(basename "$d")
            [ "$name" = "$first" ] && continue
            diff -q "$ref_list" "$d/list.txt" >/dev/null || {
              echo "::error::$name ships a different lib/**/*.rb file set than $first"
              exit 1
            }
            hashes=$(cd "$d" && xargs md5sum < list.txt | sort -k2)
            diff -q <(echo "$ref_hashes") <(echo "$hashes") >/dev/null || {
              echo "::error::$name Ruby sources differ from $first (version skew)"
              exit 1
            }
          done
          echo "Ruby sources byte-identical across $valid variants"

      - name: Verify the glibc + musl fat gems and the source gem
        if: matrix.suffix == 'linux-all'
        shell: bash
        run: |
          set -eux
          ls pkg/
          verify() {
            local image="$1" gem="$2" setup="$3"
            docker run --rm -v "$PWD:/w" -w /w "$image" sh -c "
              set -eux
              $setup
              gem install --local $gem --no-document
              ruby scripts/gem_verify.rb"
          }
          for v in 3.3 3.4 4.0; do
            verify "ruby:${v}-bookworm" "pkg/teptris-*-x86_64-linux.gem" \
              "apt-get update -qq >/dev/null && apt-get install -y -qq make gcc g++ cmake >/dev/null"
            verify "ruby:${v}-alpine" "pkg/teptris-*-x86_64-linux-musl.gem" \
              "apk add --no-cache build-base make gcc g++ cmake >/dev/null"
          done
          docker run --rm -v "$PWD:/w" -w /w ruby:3.3-bookworm sh -c '
            set -eux
            apt-get update -qq >/dev/null && apt-get install -y -qq make gcc g++ cmake >/dev/null
            # ruby-platform gems carry no platform suffix in the FILE name
            srcgem=$(ls pkg/teptris-*.gem | grep -E 'teptris-[0-9.]+\.gem$')
            gem install --local "$srcgem" --no-document
            ruby scripts/gem_verify.rb'

      - name: Install the assembled gem locally and round-trip
        if: matrix.suffix != 'linux-all'
        shell: bash
        run: |
          set -eux
          ls pkg/
          gem install --local pkg/teptris-*-${{ matrix.suffix }}.gem --no-document
          ruby scripts/gem_verify.rb

