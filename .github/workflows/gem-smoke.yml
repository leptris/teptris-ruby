name: published-gem smoke

# Installs the PUBLISHED gem from rubygems (not the checkout) on every
# released Windows Ruby and round-trips load/dump. Guards the fat-gem
# per-minor layout (the #38/#15 "dies on require" bug class) against
# regressions on the artifact users actually install.

on:
  workflow_dispatch:
  # the release lane triggers this automatically after publishing -
  # the published-gem gate no longer depends on someone remembering
  # to dispatch it
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    name: ${{ matrix.os }} (published gem)
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: x86_64-linux }
          - { os: macos-latest,  platform: arm64-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install the published gem and round-trip
        shell: bash
        run: |
          V=$(curl -s https://rubygems.org/api/v1/versions/teptris/latest.json | sed 's/.*"version":"\([^"]*\)".*/\1/')
          echo "smoking teptris $V (${{ matrix.platform }})"
          # latest.json can lead the installable index by a minute or
          # two right after a release - retry through the propagation
          for i in 1 2 3 4 5 6; do
            gem install teptris --version "$V" --platform ${{ matrix.platform }} && break
            [ "$i" = 6 ] && exit 1
            sleep 25
          done
          ruby scripts/gem_smoke.rb

  # Emulated/exotic published-gem legs (dispatch lane, mirrors the
  # release's qemu cells): install the PREBUILT gem inside a matching
  # emulated container and round-trip. ruby:3.3-alpine is multi-arch
  # (musl flavors); gnu flavors use ubuntu + apt ruby. No compilers
  # needed - the .so ships inside the gem.
  exotic:
    name: ${{ matrix.platform }} (qemu published gem)
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    platform: arm-linux-musl,       image: "ruby:3.3-alpine",      qemu: linux/arm/v7 }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux-musl,   image: "ruby:3.3-alpine",      qemu: "" }
          # fat-musl minors (native containers, no emulation)
          - { os: ubuntu-latest,    platform: x86_64-linux-musl,    image: "ruby:3.4-alpine",      qemu: "" }
          - { os: ubuntu-latest,    platform: x86_64-linux-musl,    image: "ruby:4.0-alpine",      qemu: "" }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux-musl,   image: "ruby:3.4-alpine",      qemu: "" }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux-musl,   image: "ruby:4.0-alpine",      qemu: "" }
          - { os: ubuntu-latest,    platform: arm-linux,            image: "ubuntu:24.04",         qemu: linux/arm/v7 }
          - { os: ubuntu-latest,    platform: powerpc64le-linux,    image: "ubuntu:24.04",         qemu: linux/ppc64le }
          - { os: ubuntu-latest,    platform: s390x-linux,          image: "ubuntu:24.04",         qemu: linux/s390x }
    steps:
      - uses: actions/checkout@v4
      - name: Ensure binfmt handlers
        if: matrix.qemu != ''
        run: docker run --privileged --rm tonistiigi/binfmt --install arm,ppc64le,s390x
      - name: Install the published gem and round-trip
        env:
          IMAGE: ${{ matrix.image }}
          QEMU: ${{ matrix.qemu }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # resolve the latest version host-side; the container reads it
          # from the environment
          # shellcheck disable=SC2034  # consumed inside the container via -e V
          V=$(curl -s https://rubygems.org/api/v1/versions/teptris/latest.json | sed -E 's/.*"version":"([^"]+)".*/\1/')
          PLAT=()
          if [ -n "$QEMU" ]; then PLAT=(--platform "$QEMU"); fi
          case "$IMAGE" in
            # ruby:3.3-alpine ships ruby+rubygems (source-built); the
            # split ruby-* packages do not exist in its repos
            *alpine) SETUP=":" ;;
            *)       SETUP="apt-get update -qq && apt-get install -y --no-install-recommends ruby-full ruby-dev" ;;
          esac
          docker run --rm -e PLATFORM -e "V=$V" "${PLAT[@]}" \
            -v "${PWD}:/work" -w /work "$IMAGE" sh -c '
              set -eux
              '"$SETUP"'
              case "$PLATFORM" in
                # musl platforms: rubygems resolution (plain OR
                # --platform) falls through to the glibc gem on 3.5.22
                # (probe-verified) - fetch the musl gem file and install
                # it locally, which bypasses matching entirely
                *musl)
                  for i in 1 2 3 4 5 6; do
                    gem fetch teptris -v "$V" --platform "$PLATFORM" && break
                    [ "$i" = 6 ] && exit 1
                    sleep 25
                  done
                  gem install ./teptris-"$V"-"$PLATFORM".gem --local --no-document ;;
                *)
                  for i in 1 2 3 4 5 6; do
                    gem install teptris --no-document --platform "$PLATFORM" && break
                    [ "$i" = 6 ] && exit 1
                    sleep 25
                  done ;;
              esac
              ruby scripts/gem_smoke.rb
            '


  # Unix prebuilt gems carry one extension per ruby minor (fat
  # layout): every minor the fat gem claims gets smoked on a real
  # runner — a 3.3-built .so hard-failed dlopen under ruby 4.0 and
  # nothing caught it while the unix legs only ran 3.3 images.
  unix-native:
    name: ${{ matrix.platform }} ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  platform: x86_64-linux,  ruby: '3.3' }
          - { os: ubuntu-latest,  platform: x86_64-linux,  ruby: '3.4' }
          - { os: ubuntu-latest,  platform: x86_64-linux,  ruby: '4.0' }
          - { os: macos-latest,   platform: arm64-darwin,  ruby: '3.4' }
          - { os: macos-latest,   platform: arm64-darwin,  ruby: '4.0' }
          - { os: macos-15-intel, platform: x86_64-darwin, ruby: '3.4' }
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install the published gem and round-trip
        shell: bash
        run: |
          V=$(curl -s https://rubygems.org/api/v1/versions/teptris/latest.json | sed 's/.*"version":"\([^"]*\)".*/\1/')
          echo "smoking teptris $V"
          # latest.json can lead the installable index by a minute or
          # two right after a release - retry through the propagation
          for i in 1 2 3 4 5 6; do
            gem install teptris --version "$V" --platform ${{ matrix.platform }} && break
            [ "$i" = 6 ] && exit 1
            sleep 25
          done
          ruby scripts/gem_smoke.rb

  windows:
    name: ${{ matrix.platform }} ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,  platform: x64-mingw32,        ruby: '3.0' }
          - { os: windows-latest,  platform: x64-mingw-ucrt,     ruby: '3.1' }
          - { os: windows-latest,  platform: x64-mingw-ucrt,     ruby: '3.2' }
          - { os: windows-latest,  platform: x64-mingw-ucrt,     ruby: '3.3' }
          - { os: windows-latest,  platform: x64-mingw-ucrt,     ruby: '3.4' }
          - { os: windows-latest,  platform: x64-mingw-ucrt,     ruby: '4.0' }
          - { os: windows-11-arm,  platform: aarch64-mingw-ucrt, ruby: '3.4' }
          - { os: windows-11-arm,  platform: aarch64-mingw-ucrt, ruby: '4.0' }
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install the published gem and round-trip
        shell: bash
        run: |
          # always smoke the LATEST published version (a pinned version
          # silently stops testing the current release train)
          V=$(curl -s https://rubygems.org/api/v1/versions/teptris/latest.json | sed 's/.*"version":"\([^"]*\)".*/\1/')
          echo "smoking teptris $V"
          # latest.json can lead the installable index by a minute or
          # two right after a release - retry through the propagation
          for i in 1 2 3 4 5 6; do
            gem install teptris --version "$V" --platform ${{ matrix.platform }} && break
            [ "$i" = 6 ] && exit 1
            sleep 25
          done
          ruby scripts/gem_smoke.rb
