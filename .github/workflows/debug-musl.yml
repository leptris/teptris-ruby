name: debug-musl-install

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe gem install resolution inside alpine arm64
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${PWD}:/work" -w /work ruby:3.3-alpine sh -c '
              set -eux
              ruby -v
              gem -v
              ruby -e "require \"rubygems\"; puts Gem::Platform.local; puts Gem::VERSION; puts Gem.platforms.inspect"
              echo "--- plain install ---"
              gem install teptris --no-document || true
              echo "--- explicit musl platform ---"
              gem install teptris --no-document --platform aarch64-linux-musl --verbose 2>&1 | tail -20 || true
              echo "--- fetch + local install ---"
              gem fetch teptris -v 0.2.37 --platform aarch64-linux-musl
              ls *.gem
              gem install ./teptris-0.2.37-aarch64-linux-musl.gem --local --no-document || gem install ./teptris-0.2.37-aarch64-linux-musl.gem --local --no-document --force
              ruby scripts/gem_smoke.rb
            '
